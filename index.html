<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tejas Prajapati | Full Stack Developer Portfolio</title>
    <meta name="description" content="Portfolio of Tejas Prajapati - Full Stack Developer, MERN Stack Developer, and Computer Engineering Student.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Canvas and Glowing Blobs -->
    <div class="bg-wrapper">
        <div class="glow-blob glow-blue"></div>
        <div class="glow-blob glow-purple"></div>
        <canvas id="particle-canvas"></canvas>
        <div class="spotlight" id="spotlight"></div>
    </div>

    <!-- Main Container -->
    <main class="hero-container">
        <!-- Navigation Badge/Header -->
        <header class="header-nav animate-fade-in">
            <div class="logo">TP<span>.</span></div>
            <div class="status-badge">
                <span class="status-dot"></span>
                <span>Open for Opportunities</span>
            </div>
        </header>

        <section class="hero-content">
            <!-- Left Info Panel -->
            <div class="hero-text-panel animate-slide-up">
                <div class="intro-badge">
                    <span class="sparkle">✨</span> Welcome to my digital space
                </div>
                
                <h1 class="greeting-heading">
                    <span class="greeting-intro">Hi, I'm</span>
                    <span class="name-highlight">Tejas Prajapati</span>
                </h1>

                <!-- Typing Animation Section -->
                <div class="typing-container">
                    <span class="typing-static">A passionate</span>
                    <span class="typing-text" id="typing-text"></span>
                    <span class="typing-cursor">|</span>
                </div>

                <!-- Subtitle Cards / List -->
                <div class="subtitle-card-container">
                    <div class="subtitle-badge">
                        <svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16.5 9.4 7.55 4.24a1.78 1.78 0 0 0-2.5 1.55v12.42a1.78 1.78 0 0 0 2.5 1.55l8.95-5.17a1.78 1.78 0 0 0 0-3.1Z"/>
                        </svg>
                        <span>Full Stack Developer</span>
                    </div>
                    <div class="subtitle-badge">
                        <svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect width="18" height="18" x="3" y="3" rx="2"/>
                            <path d="M21 9H3M21 15H3M12 3v18"/>
                        </svg>
                        <span>MERN Stack Developer</span>
                    </div>
                    <div class="subtitle-badge">
                        <svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                            <path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5"/>
                        </svg>
                        <span>Computer Engineering Student</span>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="cta-buttons">
                    <a href="#resume" class="btn btn-primary" id="download-resume">
                        <span>Download Resume</span>
                        <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M12 5v14M19 12l-7 7-7-7"/>
                        </svg>
                    </a>
                    <a href="#projects" class="btn btn-secondary" id="view-projects">
                        <span>View Projects</span>
                        <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </a>
                </div>

                <!-- Social Links -->
                <div class="social-links">
                    <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="GitHub" id="github-link">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.11.82-.26.82-.577v-2.234c-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22v3.293c0 .319.22.694.825.576C20.565 21.795 24 17.3 24 12c0-6.63-5.37-12-12-12z"/>
                        </svg>
                    </a>
                    <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" class="social-icon" aria-label="LinkedIn" id="linkedin-link">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
                        </svg>
                    </a>
                    <a href="mailto:tejas@example.com" class="social-icon" aria-label="Email" id="email-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="20" height="16" x="2" y="4" rx="2"/>
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                        </svg>
                    </a>
                </div>
            </div>

            <!-- Right Profile Illustration Panel -->
            <div class="hero-image-panel animate-fade-in">
                <div class="image-wrapper-outer">
                    <div class="glowing-ring"></div>
                    <div class="image-wrapper-inner">
                        <img src="assets/profile.png" alt="Futuristic Tech Emblem" class="profile-img" id="profile-img">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- App Logic Script -->
    <script src="script.js"></script>
</body>
</html>
